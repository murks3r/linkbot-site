# The fast check of BUILD MODE (CLAUDE.md, rule 2): types and the unit tests on every pull request
# and on the integration branch. The browser acceptance (`npm run test:browser`) is not run here:
# it needs a checkout of the app (LINKBOT_APP_DIR, for its accessibility audit) and runs at
# milestones, locally, until it stands on its own.
name: check

on:
  pull_request:
  push:
    branches: [build/vision, main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

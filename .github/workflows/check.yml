# CI only where it is actually necessary (CLAUDE.md, BUILD MODE rule 2): the fast check runs on
# pushes and pull requests to `main`, that is on the final head before a milestone merge, and by
# hand (workflow_dispatch). Pull requests into `build/vision` are merged on local evidence (the
# commands and their results pasted into the PR), so they trigger nothing here. Docs-only changes
# skip the run. The browser acceptance (`npm run test:browser`) runs at milestones, locally: it
# needs a checkout of the app for its accessibility audit.
name: check

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: typecheck, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

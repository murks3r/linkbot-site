<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Logo misuse examples"><title>Linkbot logo misuse sheet</title>
  <rect width="720" height="400" fill="#F4F1EA" />
  <g font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.2">
    <text x="40" y="40" fill="#1D5B45">CORRECT</text>
    <g transform="translate(40 60) scale(0.9)"><g color="#14161A">  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M29.30 21.51 L21.51 29.30 L10.49 29.30 L2.70 21.51 L2.70 10.49 L10.49 2.70 L21.51 2.70 L29.30 10.49 Z" />
    <path d="M9 9 H23 V23 H9 Z" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="currentColor" /></g></g>
    <text x="40" y="150" fill="#565C63">Fixed lockup, surface colour, nothing added.</text>
    <text x="380" y="40" fill="#8E2F2F">STRETCH</text>
    <g transform="translate(380 60) scale(1.7 0.7)"><g color="#14161A">  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M29.30 21.51 L21.51 29.30 L10.49 29.30 L2.70 21.51 L2.70 10.49 L10.49 2.70 L21.51 2.70 L29.30 10.49 Z" />
    <path d="M9 9 H23 V23 H9 Z" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="currentColor" /></g></g>
    <text x="40" y="230" fill="#8E2F2F">RECOLOUR</text>
    <g transform="translate(40 250) scale(0.9)" color="#B4004E"><g color="#14161A">  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M29.30 21.51 L21.51 29.30 L10.49 29.30 L2.70 21.51 L2.70 10.49 L10.49 2.70 L21.51 2.70 L29.30 10.49 Z" />
    <path d="M9 9 H23 V23 H9 Z" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="currentColor" /></g></g>
    <text x="380" y="230" fill="#8E2F2F">EFFECTS</text>
    <g transform="translate(380 250) scale(0.9)" filter="url(#sh)"><g color="#14161A">  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M29.30 21.51 L21.51 29.30 L10.49 29.30 L2.70 21.51 L2.70 10.49 L10.49 2.70 L21.51 2.70 L29.30 10.49 Z" />
    <path d="M9 9 H23 V23 H9 Z" />
  </g>
  <circle cx="16" cy="16" r="2.6" fill="currentColor" /></g></g>
    <defs><filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.6" /></filter></defs>
    <text x="40" y="372" fill="#565C63">Also prohibited: rotating, outlining, placing on busy
      imagery, redrawing the mark, cropping clearspace, per-experience variants.</text>
  </g>
</svg>
